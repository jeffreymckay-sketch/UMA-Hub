<script>
    /**
     * Logic for the Proctoring Master Schedule page.
     */
    function loadProctorSchedulePage() {
        const view = document.getElementById('page-ProctorSchedule');
        // Only render if empty to avoid wiping it out if they click back
        if (view.innerHTML.trim() !== '') return;
    
        view.innerHTML = `
            <div class="widget">
                <h2 style="margin-top:0; color:var(--color-primary-navy);">Master Exam Schedule</h2>
                <p style="color:#666;">
                    This tool gathers every exam from the Nursing and MLT modules and compiles them into a single Google Sheet.
                    The generated sheet will include direct links to the proctoring documents.
                </p>
                
                <div style="margin-top: 40px; margin-bottom: 40px; text-align: center; padding: 50px; border: 2px dashed #ccc; border-radius: 12px; background: #f9f9f9;">
                    
                    <div style="margin-bottom: 20px;">
                        <span style="font-size: 40px;">📅</span>
                    </div>
    
                    <button id="btn-gen-schedule" class="button-primary" style="font-size: 1.1em; padding: 12px 24px;" onclick="generateMasterSchedule()">
                        Generate Master Schedule
                    </button>
                    
                    <div id="gen-schedule-status" style="margin-top: 25px; min-height: 20px;"></div>
                </div>
            </div>
        `;
    }
    
    function generateMasterSchedule() {
        const btn = document.getElementById('btn-gen-schedule');
        const status = document.getElementById('gen-schedule-status');
        
        // UI Feedback
        btn.disabled = true;
        const originalText = btn.textContent;
        btn.textContent = "Gathering Data...";
        status.innerHTML = '<div class="loader-ring" style="margin: 0 auto; width: 30px; height: 30px; border-width: 4px;"></div><div style="margin-top:10px; color:#666;">Reading Nursing and MLT data...</div>';
    
        google.script.run
            .withSuccessHandler(res => {
                btn.disabled = false;
                btn.textContent = originalText;
                
                if (res.success) {
                    status.innerHTML = `
                        <div style="color: var(--color-primary-green); font-weight:bold; margin-bottom: 15px;">
                            ✅ Schedule Created Successfully!
                        </div>
                        <a href="${res.url}" target="_blank" class="button-success" style="text-decoration:none; padding: 10px 20px;">
                            Open Spreadsheet
                        </a>
                    `;
                } else {
                    status.innerHTML = `<div style="color: var(--color-danger);">❌ Error: ${res.message}</div>`;
                }
            })
            .withFailureHandler(err => {
                btn.disabled = false;
                btn.textContent = originalText;
                status.innerHTML = `<div style="color: var(--color-danger);">❌ System Error: ${err.message}</div>`;
            })
            .api_generateMasterExamSchedule();
    }
    </script>
