function loadSavedSheetInfo() {
  try {
    const savedUrl = localStorage.getItem('proofing-sheet-url');
    const savedTab = localStorage.getItem('proofing-tab-name');
    
    if (savedUrl) {
      document.getElementById('proofing-sheet-url').value = savedUrl;
    }
    if (savedTab) {
      document.getElementById('proofing-tab-name').value = savedTab;
    }
  } catch (e) {
    console.warn('Could not load saved sheet info:', e);
  }
}

function saveSheetInfo(url, tab) {
  try {
    localStorage.setItem('proofing-sheet-url', url);
    localStorage.setItem('proofing-tab-name', tab);
  } catch (e) {
    console.warn('Could not save sheet info:', e);
  }
}

function handleLoadProofingSheetData() {
  const urlInput = document.getElementById('proofing-sheet-url');
  const tabInput = document.getElementById('proofing-tab-name');
  const btn = document.getElementById('btn-load-proofing-data');
  const feedback = document.getElementById('proofing-load-feedback');
  
  const sheetUrl = urlInput.value.trim();
  const tabName = tabInput.value.trim() || '';
  
  if (!sheetUrl) {
    feedback.innerHTML = '<div style="color:#dc3545; font-weight:600;">⚠️ Please paste a Google Sheet URL.</div>';
    return;
  }
  
  proofingToolsState.sheetUrl = sheetUrl;
  proofingToolsState.tabName = tabName;
  
  saveSheetInfo(sheetUrl, tabName);
  
  btn.disabled = true;
  btn.textContent = 'Loading...';
  feedback.innerHTML = '<div style="color:#666;">🔄 Fetching sheet data...</div>';
  
  google.script.run
    .withSuccessHandler(response => {
      btn.disabled = false;
      btn.textContent = 'Load Data';
      
      if (response.success) {
        proofingToolsState.headers = response.headers;
        proofingToolsState.rawData = response.rows;
        proofingToolsState.filteredData = response.rows;
        proofingToolsState.filters = {};
        proofingToolsState.groupByColumn = null;
        proofingToolsState.selectedHeaders = response.headers.map((h, i) => i);
        proofingToolsState.crossReferenceActive = false;
        
        feedback.innerHTML = `<div style="color:#28a745; font-weight:600;">✅ Loaded ${response.rows.length} rows with ${response.headers.length} columns.</div>`;
        
        document.getElementById('proofing-header-selection').style.display = 'block';
        document.getElementById('proofing-filter-section').style.display = 'block';
        document.getElementById('proofing-grouping-section').style.display = 'block';
        document.getElementById('proofing-data-section').style.display = 'block';
        
        renderHeaderCheckboxes();
        renderProofingFilters();
        renderGroupByDropdown();
        renderProofingDataTable();
      } else {
        feedback.innerHTML = `<div style="color:#dc3545; font-weight:600;">❌ Error: ${response.message}</div>`;
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = 'Load Data';
      feedback.innerHTML = `<div style="color:#dc3545; font-weight:600;">❌ Server Error: ${err.message}</div>`;
    })
    .api_lookup_getData(sheetUrl, tabName);
}

function renderHeaderCheckboxes() {
  const container = document.getElementById('proofing-header-checkboxes');
  container.innerHTML = '';
  
  proofingToolsState.headers.forEach((header, index) => {
    const isChecked = proofingToolsState.selectedHeaders.includes(index);
    
    const label = document.createElement('label');
    label.className = `proofing-header-checkbox ${isChecked ? 'checked' : ''}`;
    label.innerHTML = `
      <input type="checkbox" 
        ${isChecked ? 'checked' : ''} 
        onchange="handleHeaderToggle(${index}, this.checked)">
      <span>${escapeProofingHtml(header)}</span>
    `;
    container.appendChild(label);
  });
  
  updateHeaderCount();
}

function handleHeaderToggle(index, isChecked) {
  if (isChecked) {
    if (!proofingToolsState.selectedHeaders.includes(index)) {
      proofingToolsState.selectedHeaders.push(index);
    }
  } else {
    proofingToolsState.selectedHeaders = proofingToolsState.selectedHeaders.filter(i => i !== index);
  }
  
  const checkboxes = document.querySelectorAll('.proofing-header-checkbox');
  checkboxes[index].classList.toggle('checked', isChecked);
  
  updateHeaderCount();
  renderProofingFilters();
  renderGroupByDropdown();
  renderProofingDataTable();
}

function handleSelectAllHeaders() {
  proofingToolsState.selectedHeaders = proofingToolsState.headers.map((h, i) => i);
  renderHeaderCheckboxes();
  renderProofingFilters();
  renderGroupByDropdown();
  renderProofingDataTable();
}

function handleDeselectAllHeaders() {
  proofingToolsState.selectedHeaders = [];
  renderHeaderCheckboxes();
  renderProofingFilters();
  renderGroupByDropdown();
  renderProofingDataTable();
}

function updateHeaderCount() {
  document.getElementById('proofing-selected-count').textContent = proofingToolsState.selectedHeaders.length;
  document.getElementById('proofing-total-count').textContent = proofingToolsState.headers.length;
}

function renderProofingFilters() {
  const container = document.getElementById('proofing-filters-container');
  container.innerHTML = '';
  
  proofingToolsState.selectedHeaders.forEach(colIndex => {
    const header = proofingToolsState.headers[colIndex];
    const uniqueValues = [...new Set(proofingToolsState.rawData.map(row => row[colIndex]))].sort();
    
    const accordionDiv = document.createElement('div');
    accordionDiv.className = 'proofing-accordion';
    accordionDiv.innerHTML = `
      <div class="proofing-accordion-header" onclick="toggleProofingAccordion(${colIndex})">
        <span>${escapeProofingHtml(header)}</span>
        <span>
          <span class="proofing-badge" id="proofing-badge-${colIndex}">0</span>
          <span class="proofing-accordion-arrow">▶</span>
        </span>
      </div>
      <div class="proofing-accordion-body" id="proofing-accordion-${colIndex}">
        <select class="form-input" id="proofing-filter-${colIndex}" multiple 
          onchange="handleProofingFilterChange(${colIndex})" 
          style="width:100%; height:140px; border:2px solid var(--color-primary-navy);">
          ${uniqueValues.map(val => `<option value="${escapeProofingHtml(val)}">${escapeProofingHtml(val)}</option>`).join('')}
        </select>
      </div>
    `;
    container.appendChild(accordionDiv);
  });
  
  if (proofingToolsState.selectedHeaders.length === 0) {
    container.innerHTML = '<div style="padding:20px; text-align:center; color:#888; background:#f9f9f9; border-radius:6px;">No columns selected. Please select at least one column above.</div>';
  }
}

function toggleProofingAccordion(colIndex) {
  const header = document.querySelector(`#proofing-accordion-${colIndex}`).previousElementSibling;
  const body = document.getElementById(`proofing-accordion-${colIndex}`);
  
  header.classList.toggle('active');
  body.classList.toggle('open');
}

function renderGroupByDropdown() {
  const select = document.getElementById('proofing-group-by-select');
  select.innerHTML = '<option value="">-- No Grouping --</option>';
  
  proofingToolsState.selectedHeaders.forEach(index => {
    const header = proofingToolsState.headers[index];
    select.innerHTML += `<option value="${index}">${escapeProofingHtml(header)}</option>`;
  });
}

function handleProofingFilterChange(colIndex) {
  const selectElement = document.getElementById(`proofing-filter-${colIndex}`);
  const selectedValues = Array.from(selectElement.selectedOptions).map(opt => opt.value);
  
  const badge = document.getElementById(`proofing-badge-${colIndex}`);
  badge.textContent = selectedValues.length;
  
  if (selectedValues.length === 0) {
    delete proofingToolsState.filters[colIndex];
  } else {
    proofingToolsState.filters[colIndex] = selectedValues;
  }
  
  applyProofingFiltersWithGroupExpansion();
  renderProofingDataTable();
}

function applyProofingFiltersWithGroupExpansion() {
  // Step 1: Apply basic filters to find matching rows
  const basicFilteredRows = proofingToolsState.rawData.filter(row => {
    for (let colIndex in proofingToolsState.filters) {
      const allowedValues = proofingToolsState.filters[colIndex];
      if (!allowedValues.includes(row[colIndex])) {
        return false;
      }
    }
    return true;
  });
  
  // Step 2: If grouping is active, expand to include all rows in those groups
  if (proofingToolsState.groupByColumn !== null && Object.keys(proofingToolsState.filters).length > 0) {
    // Extract unique group values from filtered rows
    const groupValues = new Set(
      basicFilteredRows.map(row => row[proofingToolsState.groupByColumn])
    );
    
    // Show ALL rows that have any of those group values
    proofingToolsState.filteredData = proofingToolsState.rawData.filter(row => 
      groupValues.has(row[proofingToolsState.groupByColumn])
    );
    
    // Show legend when expansion is active
    document.getElementById('proofing-legend').style.display = 'flex';
  } else {
    // No grouping or no filters - just show filtered rows
    proofingToolsState.filteredData = basicFilteredRows;
    document.getElementById('proofing-legend').style.display = 'none';
  }
}

function handleClearProofingFilters() {
  proofingToolsState.filters = {};
  proofingToolsState.filteredData = proofingToolsState.rawData;
  
  proofingToolsState.headers.forEach((header, index) => {
    const selectEl = document.getElementById(`proofing-filter-${index}`);
    if (selectEl) {
      Array.from(selectEl.options).forEach(opt => opt.selected = false);
    }
    
    const badge = document.getElementById(`proofing-badge-${index}`);
    if (badge) badge.textContent = '0';
    
    const accordion = document.getElementById(`proofing-accordion-${index}`);
    const accordionHeader = accordion ? accordion.previousElementSibling : null;
    if (accordion) accordion.classList.remove('open');
    if (accordionHeader) accordionHeader.classList.remove('active');
  });
  
  document.getElementById('proofing-legend').style.display = 'none';
  renderProofingDataTable();
}

function handleGroupByChange() {
  const select = document.getElementById('proofing-group-by-select');
  const value = select.value;
  
  if (value === '') {
    proofingToolsState.groupByColumn = null;
  } else {
    proofingToolsState.groupByColumn = parseInt(value);
  }
  
  // Reapply filters with group expansion
  applyProofingFiltersWithGroupExpansion();
  renderProofingDataTable();
}

function handleClearGrouping() {
  proofingToolsState.groupByColumn = null;
  document.getElementById('proofing-group-by-select').value = '';
  document.getElementById('proofing-legend').style.display = 'none';
  applyProofingFiltersWithGroupExpansion();
  renderProofingDataTable();
}

function handleCellClick(rowIdx, colIdx) {
  if (proofingToolsState.editMode) return;
  
  const cellValue = proofingToolsState.filteredData[rowIdx][colIdx];
  const columnName = proofingToolsState.headers[colIdx];
  
  proofingToolsState.crossReferenceActive = true;
  proofingToolsState.crossReferenceColumn = colIdx;
  proofingToolsState.crossReferenceValue = cellValue;
  
  document.getElementById('cross-ref-column-name').textContent = columnName;
  document.getElementById('cross-ref-value').textContent = cellValue;
  document.getElementById('proofing-cross-ref-banner').style.display = 'flex';
  
  // Apply cross-reference as a filter
  proofingToolsState.filters[colIdx] = [cellValue];
  
  // Update filter UI
  const selectEl = document.getElementById(`proofing-filter-${colIdx}`);
  if (selectEl) {
    Array.from(selectEl.options).forEach(opt => {
      opt.selected = opt.value === cellValue;
    });
    const badge = document.getElementById(`proofing-badge-${colIdx}`);
    if (badge) badge.textContent = '1';
  }
  
  // If no grouping is set, auto-group by this column
  if (proofingToolsState.groupByColumn === null) {
    proofingToolsState.groupByColumn = colIdx;
    document.getElementById('proofing-group-by-select').value = colIdx;
  }
  
  applyProofingFiltersWithGroupExpansion();
  renderProofingDataTable();
}

function handleClearCrossReference() {
  proofingToolsState.crossReferenceActive = false;
  
  if (proofingToolsState.crossReferenceColumn !== null) {
    delete proofingToolsState.filters[proofingToolsState.crossReferenceColumn];
    
    const selectEl = document.getElementById(`proofing-filter-${proofingToolsState.crossReferenceColumn}`);
    if (selectEl) {
      Array.from(selectEl.options).forEach(opt => opt.selected = false);
    }
    const badge = document.getElementById(`proofing-badge-${proofingToolsState.crossReferenceColumn}`);
    if (badge) badge.textContent = '0';
  }
  
  proofingToolsState.crossReferenceColumn = null;
  proofingToolsState.crossReferenceValue = null;
  
  document.getElementById('proofing-cross-ref-banner').style.display = 'none';
  
  applyProofingFiltersWithGroupExpansion();
  renderProofingDataTable();
}

function renderProofingDataTable() {
  const thead = document.getElementById('proofing-table-head');
  const tbody = document.getElementById('proofing-table-body');
  const rowCount = document.getElementById('proofing-row-count');
  
  rowCount.textContent = proofingToolsState.filteredData.length;
  
  const selectedHeadersData = proofingToolsState.selectedHeaders.map(i => proofingToolsState.headers[i]);
  
  thead.innerHTML = `
    <tr>
      ${selectedHeadersData.map(h => `<th style="background:var(--color-primary-navy); color:white; padding:12px; text-align:left; position:sticky; top:0; z-index:10; border-right:1px solid rgba(255,255,255,0.1);">${escapeProofingHtml(h)}</th>`).join('')}
    </tr>
  `;
  
  if (proofingToolsState.filteredData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="100" style="padding:40px; text-align:center; color:#888;">📭 No data matches your filters.</td></tr>';
    return;
  }
  
  if (proofingToolsState.selectedHeaders.length === 0) {
    tbody.innerHTML = '<tr><td colspan="100" style="padding:40px; text-align:center; color:#888;">📭 No columns selected. Please select columns in Step 2.</td></tr>';
    return;
  }
  
  if (proofingToolsState.groupByColumn !== null) {
    renderGroupedData(tbody);
  } else {
    renderUngroupedData(tbody);
  }
  
  if (proofingToolsState.editMode) {
    enableProofingCellEditing();
  }
}

function renderUngroupedData(tbody) {
  // Determine which rows actually matched the filter
  const matchedRowSet = new Set();
  if (Object.keys(proofingToolsState.filters).length > 0) {
    proofingToolsState.filteredData.forEach((row, idx) => {
      let matches = true;
      for (let colIndex in proofingToolsState.filters) {
        const allowedValues = proofingToolsState.filters[colIndex];
        if (!allowedValues.includes(row[colIndex])) {
          matches = false;
          break;
        }
      }
      if (matches) matchedRowSet.add(idx);
    });
  }
  
  tbody.innerHTML = proofingToolsState.filteredData.map((row, rowIdx) => {
    const isMatched = matchedRowSet.has(rowIdx) || Object.keys(proofingToolsState.filters).length === 0;
    const rowClass = isMatched ? '' : 'proofing-grouped-row-related';
    
    return `
      <tr class="${rowClass}" style="border-bottom:1px solid #eee;">
        ${proofingToolsState.selectedHeaders.map(colIdx => {
          const cellId = `proofing-cell-${rowIdx}-${colIdx}`;
          const isHighlighted = proofingToolsState.crossReferenceActive && 
                               colIdx === proofingToolsState.crossReferenceColumn;
          
          return `<td id="${cellId}" 
                     class="proofing-cell-clickable ${isHighlighted ? 'proofing-highlighted-cell' : ''}" 
                     onclick="handleCellClick(${rowIdx}, ${colIdx})"
                     style="padding:10px; border-right:1px solid #f0f0f0; position:relative;">
                    ${escapeProofingHtml(row[colIdx])}
                    <span class="proofing-find-icon">🔗</span>
                  </td>`;
        }).join('')}
      </tr>
    `;
  }).join('');
}

function renderGroupedData(tbody) {
  const groupCol = proofingToolsState.groupByColumn;
  const groupedData = {};
  
  // Determine which rows actually matched the filter (before group expansion)
  const matchedRowIndices = new Set();
  proofingToolsState.filteredData.forEach((row, idx) => {
    let matches = true;
    for (let colIndex in proofingToolsState.filters) {
      const allowedValues = proofingToolsState.filters[colIndex];
      if (!allowedValues.includes(row[colIndex])) {
        matches = false;
        break;
      }
    }
    if (matches) matchedRowIndices.add(idx);
  });
  
  proofingToolsState.filteredData.forEach((row, idx) => {
    const groupKey = row[groupCol];
    if (!groupedData[groupKey]) {
      groupedData[groupKey] = [];
    }
    groupedData[groupKey].push({ row, originalIndex: idx });
  });
  
  let html = '';
  let globalRowIdx = 0;
  
  Object.keys(groupedData).sort().forEach(groupKey => {
    const items = groupedData[groupKey];
    const groupHeaderName = proofingToolsState.headers[groupCol];
    
    const matchedCount = items.filter(item => matchedRowIndices.has(item.originalIndex)).length;
    const relatedCount = items.length - matchedCount;
    
    html += `
      <tr>
        <td colspan="${proofingToolsState.selectedHeaders.length}" class="proofing-grouped-header">
          📌 ${escapeProofingHtml(groupHeaderName)}: <strong>${escapeProofingHtml(groupKey)}</strong>
          <span style="opacity:0.8; font-weight:normal; margin-left:10px;">
            (${matchedCount} matched${relatedCount > 0 ? `, ${relatedCount} related` : ''})
          </span>
        </td>
      </tr>
    `;
    
    items.forEach(item => {
      const isMatched = matchedRowIndices.has(item.originalIndex) || Object.keys(proofingToolsState.filters).length === 0;
      const rowClass = isMatched ? 'proofing-grouped-row-matched' : 'proofing-grouped-row-related';
      
      html += `
        <tr class="${rowClass}">
          ${proofingToolsState.selectedHeaders.map(colIdx => {
            const cellId = `proofing-cell-${globalRowIdx}-${colIdx}`;
            const isHighlighted = proofingToolsState.crossReferenceActive && 
                                 colIdx === proofingToolsState.crossReferenceColumn;
            
            return `<td id="${cellId}" 
                       class="proofing-cell-clickable ${isHighlighted ? 'proofing-highlighted-cell' : ''}" 
                       onclick="handleCellClick(${item.originalIndex}, ${colIdx})"
                       style="padding:10px; border-right:1px solid #e0e0e0; position:relative;">
                      ${escapeProofingHtml(item.row[colIdx])}
                      <span class="proofing-find-icon">🔗</span>
                    </td>`;
          }).join('')}
        </tr>
      `;
      globalRowIdx++;
    });
  });
  
  tbody.innerHTML = html;
}

function handleToggleProofingEdit() {
  proofingToolsState.editMode = !proofingToolsState.editMode;
  const btn = document.getElementById('btn-toggle-proofing-edit');
  const controls = document.getElementById('proofing-edit-controls');
  
  if (proofingToolsState.editMode) {
    btn.textContent = 'Disable Edit Mode';
    btn.classList.remove('button-secondary');
    btn.classList.add('button-warning');
    controls.style.display = 'block';
    enableProofingCellEditing();
  } else {
    btn.textContent = 'Enable Edit Mode';
    btn.classList.remove('button-warning');
    btn.classList.add('button-secondary');
    controls.style.display = 'none';
    proofingToolsState.pendingEdits = [];
    renderProofingDataTable();
  }
}

function enableProofingCellEditing() {
  proofingToolsState.filteredData.forEach((row, rowIdx) => {
    proofingToolsState.selectedHeaders.forEach(colIdx => {
      const cellEl = document.getElementById(`proofing-cell-${rowIdx}-${colIdx}`);
      if (cellEl) {
        cellEl.contentEditable = true;
        cellEl.style.cursor = 'text';
        cellEl.style.minWidth = '100px';
        cellEl.onclick = null;
        
        cellEl.addEventListener('blur', function() {
          const newValue = this.textContent.trim();
          const oldValue = row[colIdx];
          
          if (newValue !== oldValue) {
            this.style.backgroundColor = '#fff3cd';
            this.style.borderLeft = '3px solid var(--color-primary-orange)';
            
            const editIndex = proofingToolsState.pendingEdits.findIndex(e => e.rowIdx === rowIdx && e.colIdx === colIdx);
            if (editIndex > -1) {
              proofingToolsState.pendingEdits[editIndex].newValue = newValue;
            } else {
              proofingToolsState.pendingEdits.push({ rowIdx, colIdx, oldValue, newValue });
            }
          }
        });
      }
    });
  });
}

function handleCancelProofingEdits() {
  if (proofingToolsState.pendingEdits.length > 0) {
    if (!confirm(`Discard ${proofingToolsState.pendingEdits.length} unsaved changes?`)) {
      return;
    }
  }
  
  proofingToolsState.pendingEdits = [];
  proofingToolsState.editMode = false;
  document.getElementById('btn-toggle-proofing-edit').textContent = 'Enable Edit Mode';
  document.getElementById('btn-toggle-proofing-edit').classList.remove('button-warning');
  document.getElementById('btn-toggle-proofing-edit').classList.add('button-secondary');
  document.getElementById('proofing-edit-controls').style.display = 'none';
  renderProofingDataTable();
}

function handleSaveProofingEdits() {
  if (proofingToolsState.pendingEdits.length === 0) {
    alert('No changes to save.');
    return;
  }
  
  if (!confirm(`Save ${proofingToolsState.pendingEdits.length} changes to the Google Sheet?`)) {
    return;
  }
  
  const btn = document.getElementById('btn-save-proofing-edits');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  
  const updates = proofingToolsState.pendingEdits.map(edit => ({
    rowIndex: edit.rowIdx + 2,
    colIndex: edit.colIdx,
    value: edit.newValue
  }));
  
  google.script.run
    .withSuccessHandler(response => {
      btn.disabled = false;
      btn.textContent = 'Save All Changes';
      
      if (response.success) {
        showNotification(`✓ Saved ${proofingToolsState.pendingEdits.length} changes`, 'success');
        proofingToolsState.pendingEdits = [];
        handleLoadProofingSheetData();
      } else {
        showNotification('Error: ' + response.message, 'error');
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = 'Save All Changes';
      showNotification('Server error: ' + err.message, 'error');
    })
    .api_bulkUpdateSheet(proofingToolsState.sheetUrl, proofingToolsState.tabName, updates);
}

function handleExportProofing() {
  if (proofingToolsState.filteredData.length === 0) {
    alert('No data to export.');
    return;
  }
  
  const btn = document.getElementById('btn-export-proofing');
  btn.disabled = true;
  btn.textContent = 'Exporting...';
  
  const selectedHeadersData = proofingToolsState.selectedHeaders.map(i => proofingToolsState.headers[i]);
  const filteredRows = proofingToolsState.filteredData.map(row => 
    proofingToolsState.selectedHeaders.map(i => row[i])
  );
  
  google.script.run
    .withSuccessHandler(response => {
      btn.disabled = false;
      btn.textContent = 'Export Filtered Data';
      
      if (response.success) {
        showNotification('✓ Export complete!', 'success');
        window.open(response.url, '_blank');
      } else {
        showNotification('Export failed: ' + response.error, 'error');
      }
    })
    .withFailureHandler(err => {
      btn.disabled = false;
      btn.textContent = 'Export Filtered Data';
      showNotification('Server error: ' + err.message, 'error');
    })
    .exportToSheet(selectedHeadersData, filteredRows);
}

function escapeProofingHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}
</script>
