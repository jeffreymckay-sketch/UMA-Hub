<style>
    /* Styling inherits from JS_Nursing.html mostly */
    #mlt-course-container { margin-top: 15px; }
</style>

<script>
    // --- Global State for MLT Batching ---
    let mltBatchState = {
       queue: [],
       total: 0,
       processed: 0,
       action: '', 
       isRunning: false
    };

    // --- CONTEXT STATE ---
    // Tracks if the currently open sidebar belongs to MLT
    let isMltSidebarOpen = false;

    // --- 1. SIDEBAR OPENER PATCH ---
    // Overrides global function to support MLT data
    const originalSidebarFn = window.openAccommodationsSidebar;

    window.openAccommodationsSidebar = function(sheetName, examName, type) {
        console.log("Opening Sidebar for:", sheetName, examName, type);
        
        let targetDataSource = null;

        if (type === 'mlt') {
            targetDataSource = g.mltData;
            isMltSidebarOpen = true; // SET FLAG
        } else {
            targetDataSource = g.nursingData;
            isMltSidebarOpen = false; // RESET FLAG
        }

        if (!targetDataSource || !targetDataSource.data || !targetDataSource.data.sheets) {
            showNotification("Error: Data source not loaded.", "error");
            return;
        }

        // HACK: Temporarily swap nursingData so the old function finds the exam
        const tempHold = g.nursingData;
        g.nursingData = targetDataSource; 
             
        try {
            if (originalSidebarFn) originalSidebarFn(sheetName, examName);
        } catch(e) {
            console.error("Sidebar open failed:", e);
            showNotification("Sidebar Error: " + e.message, "error");
        } finally {
            // Restore immediately so we don't break other parts of the app
            g.nursingData = tempHold;
        }
    };

    // --- 2. SIDEBAR SAVER PATCH ---
    // Intercepts the Save action to inject MLT data if needed
    const originalSaveFn = window.saveAccommodations;

    window.saveAccommodations = function() {
        console.log("Intercepted Save. Is MLT?", isMltSidebarOpen);

        // If we are in MLT mode, we must swap the data again just for this save operation
        if (isMltSidebarOpen) {
            const tempHold = g.nursingData;
            g.nursingData = g.mltData; // Swap to MLT
            
            try {
                // Call original saver (now it sees the correct data)
                if (originalSaveFn) originalSaveFn();
            } catch (e) {
                console.error("MLT Save Error:", e);
                showNotification("Save Error: " + e.message, "error");
            } finally {
                // Always restore
                g.nursingData = tempHold;
            }
        } else {
            // Standard Nursing behavior
            if (originalSaveFn) originalSaveFn();
        }
    };


    // --- MLT PAGE LOGIC ---

    function loadMLTPage() {
       const docTabBtn = document.querySelector('button[onclick*="MLT-DocManagement"]');
       if (docTabBtn) openTab({ currentTarget: docTabBtn }, 'MLT-DocManagement');

       renderMLTSettings();

       if (g.mltData && g.mltData.success) {
           renderMLTDocManagement(g.mltData);
       } else {
           const view = document.getElementById('MLT-DocManagement');
           view.innerHTML = '<div class="loader-container" style="position:relative; height:200px;"><div class="loader-ring"></div></div>';
           
           google.script.run
           .withSuccessHandler(res => {
               g.mltData = res;
               if(res.success) renderMLTDocManagement(res);
               else view.innerHTML = `<div class="error-message">${res.message}</div>`;
           })
           .api_getMLTData();
       }
    }

    function renderMLTDocManagement(response) {
       const view = document.getElementById('MLT-DocManagement');
       view.innerHTML = '';

       const header = document.createElement('div');
       header.className = 'proctoring-header';
       header.innerHTML = `
           <h2 style="margin:0; color: var(--color-primary-navy);">MLT Doc Management</h2>
           <div class="proctoring-actions">
               <input type="text" id="mlt-exam-search" class="form-input" placeholder="Search exams..." onkeyup="filterMLTExams()" style="width:200px">
               <button id="mlt-create-btn" class="button-primary" onclick="handleMLTBulkAction('create')">Generate All</button>
               <button id="mlt-update-btn" class="button-secondary" onclick="handleMLTBulkAction('update')">Update All</button>
           </div>
       `;
       view.appendChild(header);

       const container = document.createElement('div');
       container.id = 'mlt-course-container';

       if (!response.data || !response.data.sheets || response.data.sheets.length === 0) {
           container.innerHTML = '<div style="padding:40px; text-align:center;">No exams found. Check Settings.</div>';
       } else {
           response.data.sheets.forEach(sheet => {
               container.appendChild(buildMLTCourseSection(sheet.fullTitle, sheet.sheetName, sheet.exams));
           });
       }
       view.appendChild(container);
    }

    function buildMLTCourseSection(fullTitle, sheetName, exams) {
        const section = document.createElement('div');
        section.className = 'course-section';
        
        const header = document.createElement('div');
        header.className = 'course-header';
        header.innerHTML = `<span>${fullTitle}</span> <span style="font-weight:normal; font-size:0.9em; color:#666;">(${exams.length} exams)</span>`;
        header.onclick = () => section.classList.toggle('open');
        
        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'course-content';
        
        const contentInner = document.createElement('div');
        contentInner.className = 'course-content-inner';

        const grid = document.createElement('div');
        grid.className = 'exam-grid';
        
        exams.forEach(exam => {
            grid.appendChild(buildMLTExamCard({ ...exam, _sheetName: sheetName, _fullTitle: fullTitle }));
        });
        
        contentInner.appendChild(grid);
        contentWrapper.appendChild(contentInner);
        section.appendChild(header);
        section.appendChild(contentWrapper);
        return section;
    }

    function buildMLTExamCard(exam) {
        const hasDoc = !!exam.docUrl;
        const headerClass = hasDoc ? 'header-created' : 'header-not-created';
        
        const card = document.createElement('div');
        card.className = 'exam-card';
        card.dataset.examName = (exam.name || '').toLowerCase();

        const safeSheet = (exam._sheetName || '').replace(/'/g, "\\'");
        const safeExam = (exam.name || '').replace(/'/g, "\\'");

        let btns = '';
        if (hasDoc) {
             btns = `
             <button class="btn-sm btn-std button-update-active" onclick="handleMLTSingle(this, 'update', '${safeSheet}', '${safeExam}')">Update</button>
             <a href="${exam.docUrl}" target="_blank" class="btn-sm btn-std button-view">View</a>`;
        } else {
             btns = `
             <button class="btn-sm btn-std button-update-inactive" disabled>Update</button>
             <button class="btn-sm btn-std button-create" onclick="handleMLTSingle(this, 'create', '${safeSheet}', '${safeExam}')">Create</button>`;
        }

        card.innerHTML = `
            <div class="exam-card-header ${headerClass}"><h4>${exam.name}</h4></div>
            <div class="exam-card-body">
                <div class="exam-info-row"><span class="exam-label">Date:</span> <span class="exam-value">${exam.date || '-'}</span></div>
                <div class="exam-info-row"><span class="exam-label">Time:</span> <span class="exam-value">${exam.siteTime || '-'}</span></div>
                <div class="exam-info-row"><span class="exam-label">Room:</span> <span class="exam-value">${exam.room || '-'}</span></div>
            </div>
            <div class="exam-card-footer">
                <button class="btn-sm button-navy" onclick="openAccommodationsSidebar('${safeSheet}', '${safeExam}', 'mlt')">Students</button>
                <div class="footer-right">${btns}</div>
            </div>
        `;
        return card;
    }

    // --- Handlers ---
    function handleMLTSingle(btn, action, sheetName, examName) {
        btn.disabled = true;
        btn.textContent = '...';

        const func = action === 'create' ? 'createMLTProctoringDocuments' : 'updateAllMLTDocuments';
        
        const sheetObj = g.mltData.data.sheets.find(s => s.sheetName === sheetName);
        const examObj = sheetObj.exams.find(e => e.name === examName);
        
        const payload = { 
            sheets: [{ 
                fullTitle: sheetObj.fullTitle, 
                course: sheetObj.course,
                exams: [examObj] 
            }] 
        };

        google.script.run.withSuccessHandler(res => {
            if(res.success) {
                showNotification(res.message, 'success');
                if(res.createdUrls && res.createdUrls[examName]) examObj.docUrl = res.createdUrls[examName];
                
                const newCard = buildMLTExamCard({ ...examObj, _sheetName: sheetName, _fullTitle: sheetObj.fullTitle });
                btn.closest('.exam-card').replaceWith(newCard);
            } else {
                showNotification(res.message, 'error');
                btn.disabled = false;
                btn.textContent = (action==='create'?'Create':'Update');
            }
        }).withFailureHandler(e => showNotification(e.message,'error'))[func](payload);
    }

    function handleMLTBulkAction(action) {
        if (!g.mltData || !g.mltData.data) return;
        const allItems = [];
        
        g.mltData.data.sheets.forEach(sheet => {
            sheet.exams.forEach(exam => {
                allItems.push({ 
                    sheetName: sheet.sheetName, 
                    fullTitle: sheet.fullTitle, 
                    exams: exam 
                });
            });
        });

        if (allItems.length === 0) return;

        mltBatchState = { queue: allItems, total: allItems.length, processed: 0, action: action };
        showProgressModal(true);
        processNextMLTBatch();
    }

    function processNextMLTBatch() {
        if (mltBatchState.processed >= mltBatchState.total) {
            showProgressModal(false);
            showNotification("Batch Complete", "success");
            g.mltData = null; // Clear cache
            loadMLTPage(); // Reload
            return;
        }

        const chunk = mltBatchState.queue.slice(mltBatchState.processed, mltBatchState.processed + 5);
        
        const tempMap = {};
        chunk.forEach(item => {
            if(!tempMap[item.sheetName]) tempMap[item.sheetName] = { fullTitle: item.fullTitle, exams: [] };
            tempMap[item.sheetName].exams.push(item.exams);
        });

        const payload = { sheets: Object.values(tempMap) };
        const func = mltBatchState.action === 'create' ? 'createMLTProctoringDocuments' : 'updateAllMLTDocuments';

        updateProgressUI(mltBatchState.processed, mltBatchState.total, "Processing...");

        google.script.run.withSuccessHandler(res => {
            if(res.success) {
                mltBatchState.processed += chunk.length;
                processNextMLTBatch();
            } else {
                showNotification("Error: " + res.message, "error");
                showProgressModal(false);
            }
        })[func](payload);
    }

    function renderMLTSettings() {
        const s = (g.allSettings.mlt_settings_new) ? g.allSettings.mlt_settings_new : (g.allSettings.MLT || {}); 
        const existingVal = (g.mltData && g.mltData.data && g.mltData.data.settings) ? g.mltData.data.settings : {};
        
        const sheetUrl = existingVal.sheetId || s.spreadsheetUrl || '';
        const folderUrl = existingVal.folderId || s.targetFolderId || '';
        const notes = existingVal.customNotes || s.customNotes || '';

        const view = document.getElementById('MLT-Settings');
        view.innerHTML = `
           <h2>MLT Settings</h2>
           <div class="form-vertical" style="max-width:600px;">
               <div class="form-group"><label>Sheet URL (or ID)</label><input id="mlt-sheet-url" class="form-input" value="${sheetUrl}"></div>
               <div class="form-group"><label>Folder URL (or ID)</label><input id="mlt-folder-url" class="form-input" value="${folderUrl}"></div>
               <div class="form-group"><label>Custom Notes</label><textarea id="mlt-notes" class="form-input">${notes}</textarea></div>
               <button class="button-primary" onclick="saveMLTSettingsInternal(this)">Save</button>
           </div>
        `;
    }

    function saveMLTSettingsInternal(btn) {
        const val = {
            spreadsheetUrl: document.getElementById('mlt-sheet-url').value,
            targetFolderId: document.getElementById('mlt-folder-url').value,
            customNotes: document.getElementById('mlt-notes').value
        };
        btn.textContent = 'Saving...';
        google.script.run.withSuccessHandler(() => {
            btn.textContent = 'Save';
            showNotification('Saved', 'success');
            g.mltData = null; // Force reload
        }).mlt_saveSettings(val);
    }

    function filterMLTExams() {
        const term = document.getElementById('mlt-exam-search').value.toLowerCase();
        document.querySelectorAll('#mlt-course-container .course-section').forEach(section => {
             let visible = 0;
             section.querySelectorAll('.exam-card').forEach(card => {
                 if(card.dataset.examName.includes(term)) {
                     card.style.display = 'flex'; visible++;
                 } else { card.style.display = 'none'; }
             });
             section.style.display = visible ? 'block' : 'none';
             if(term && visible) section.classList.add('open');
        });
    }
</script>
