                                  <li>Select the name of the staff member you want to assign.</li>

                                      </ul>
                                  </li>
                              </ul>
                              
                              <p><strong>Saving the Entire Roster</strong></p>
                              <ul>
                                  <li>Set the assignments for all shifts in the table.</li>
                                  <li>Click the blue Save Full Roster button inside the Semester Settings block at the top of the page.</li>
                                  <li>If there are any conflicts, review and confirm them in the conflict warning popup.</li>
                                  <li>The system will save all assignments simultaneously.</li>
                              </ul>

                      </div>
                  </div>

    // --- Helper to Toggle the Div-based Accordion ---
    function toggleGuide(headerEl) {

        // Toggle class

        // Stop propagation if nested to prevent parent from closing when child is clicked
        if (window.event) {
            window.event.stopPropagation();
