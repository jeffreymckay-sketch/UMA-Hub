<script>
  // --- Global Data Cache ---
  const g = {
    userInfo: null,
    dashboardData: null,
    myScheduleData: null, // Added cache for new tool
    mstData: null,
    mltData: null,
    allSettings: {},
    permissions: {}, 
    writableCalendars: null,
    allCalendars: null, 
    nursingData: null,
  };

  /**
   * MENU CONFIGURATION
   */
  const menuItems = [
    { 
      id: 'Dashboard', 
      title: 'Dashboard', 
      children: [
        { id: 'MySchedule', title: 'My Schedule' },
        { id: 'Availability', title: 'Availability' },
        { id: 'UserGuide', title: 'User Guide' }
      ]
    },
    {
      id: 'Logistics',
      title: 'Logistics',
      children: [
        { id: 'MST', title: 'MST' },
        { id: 'TechHub', title: 'Tech Hub' }
      ]
    },
    {
      id: 'Proctoring',
      title: 'Proctoring',
      children: [
        { id: 'Nursing', title: 'Nursing' },
        { id: 'MLT', title: 'MLT' },
        { id: 'ProctorSchedule', title: 'Master Schedule' }
      ]
    },
    { 
      id: 'Reporting', 
      title: 'Stats & Reports', 
      children: [
        { id: 'Reporting', title: 'Calendar Stats' },
        { id: 'ProofingTools', title: 'Proofing Tools' }
      ]
    },
    { id: 'Zoom', title: 'Zoom' },
    { id: 'Settings', title: 'Settings' }
  ];

  document.addEventListener('DOMContentLoaded', function() {
    console.log("App Started: DOMContentLoaded");
    
    // Initial load - menu will be empty until data arrives
    google.script.run
      .withSuccessHandler(handleInitialDataSuccess)
      .withFailureHandler(handleInitialError)
      .api_getInitialAppData();

    window.addEventListener('popstate', function(e) {
      const pageId = window.location.hash.substring(1) || 'MySchedule'; // Defaulted to MySchedule
      navigateToPage(pageId);
    });
  });

  function handleInitialDataSuccess(response) {
    console.log("Initial Data Received:", response);
    if (response && response.success) {
      g.userInfo = response.data.userInfo;
      g.allSettings = response.data.settings || {};
      g.permissions = response.data.permissions || {}; 

      g.mstData = response.data.mstData || null;
      g.mltData = response.data.mltData || null;
      g.writableCalendars = response.data.writableCalendars || null;
      g.allCalendars = response.data.allCalendars || null;
      g.nursingData = response.data.nursingData || null;

      populateUserInfo(); 
      buildMenu();

      const initialPage = window.location.hash.substring(1) || 'MySchedule'; // Defaulted to MySchedule
      navigateToPage(initialPage, true);
      
      document.getElementById('loader').style.display = 'none';
    } else {
      handleInitialError(response);
    }
  }

  function handleInitialError(error) {
    console.error("Initial Load Error:", error);
    const loader = document.getElementById('loader');
    if (loader) {
      loader.innerHTML = `
        <div style="padding:20px; text-align:center; color:red;">
          Failed to load application data.<br>
          ${error.message || 'Unknown Error'}
        </div>`;
    }
  }

  /**
   * Checks if the current user has access to a specific PageID
   */
  function checkAccess(pageId) {
      if (!g.userInfo) return false;
      // Get user's roles (Array)
      const userRoles = g.userInfo.role.split(',').map(r => r.trim());

      // Admin always has access (Fail-safe client side)
      if (userRoles.includes('Admin')) return true;

      // Check Matrix
      if (g.permissions && g.permissions[pageId]) {
          // Check if ANY of the user's roles are set to TRUE for this page
          return userRoles.some(role => g.permissions[pageId][role] === true);
      }
      
      // Default to false if not in matrix
      return false;
  }

  function buildMenu() {
    const menu = document.getElementById('main-menu');
    if (!menu) return;
    menu.innerHTML = '';

    menuItems.forEach(item => {
      // Check Parent Access
      const hasParentAccess = checkAccess(item.id);
      
      // If it has children, check if user has access to AT LEAST ONE child
      let hasChildAccess = false;
      if (item.children) {
          hasChildAccess = item.children.some(child => checkAccess(child.id));
      }

      // Show if parent is allowed OR if it's a container with allowed children
      if (!hasParentAccess && !hasChildAccess) return;

      if (item.children) {
        const parentLi = document.createElement('li');
        parentLi.className = 'nav-item has-submenu';
        parentLi.id = `nav-toggle-${item.id}`;
        parentLi.innerHTML = `
          <span>${item.title}</span>
          <span class="submenu-arrow">▶</span>
        `;
        parentLi.onclick = () => toggleSubmenu(item.id);

        const subUl = document.createElement('ul');
        subUl.className = 'sub-menu';
        subUl.id = `submenu-${item.id}`;

        item.children.forEach(child => {
          if (checkAccess(child.id)) {
              const childLi = document.createElement('li');
              childLi.className = 'nav-item';
              childLi.dataset.pageId = child.id;
              childLi.textContent = child.title;
              subUl.appendChild(childLi);
          }
        });

        menu.appendChild(parentLi);
        menu.appendChild(subUl);
      } else {
        const li = document.createElement('li');
        li.className = 'nav-item';
        li.dataset.pageId = item.id;
        li.textContent = item.title;
        menu.appendChild(li);
      }
    });

    menu.onclick = function(e) {
      const target = e.target.closest('.nav-item');
      if (target && target.dataset.pageId) {
        navigateToPage(target.dataset.pageId);
      }
    };
  }

  function toggleSubmenu(menuId) {
    const link = document.getElementById(`nav-toggle-${menuId}`);
    const submenu = document.getElementById(`submenu-${menuId}`);
    if (link && submenu) {
      link.classList.toggle('open');
      submenu.classList.toggle('open');
    }
  }

  function navigateToPage(pageId, isInitialLoad = false) {
    console.log("Navigating to:", pageId);

    // Security Check: Prevent navigation via URL hash if permission denied
    if (!checkAccess(pageId) && pageId !== 'MySchedule' && pageId !== 'Availability') {
        console.warn("Access Denied to " + pageId);
        pageId = 'Availability'; // Redirect to default
    }

    document.querySelectorAll('.page-view').forEach(page => page.style.display = 'none');
    
    const targetPage = document.getElementById('page-' + pageId);
    if (targetPage) {
      targetPage.style.display = 'block';
    } else {
      console.warn("Page ID not found, defaulting to Availability:", pageId);
      document.getElementById('page-Availability').style.display = 'block';
      pageId = 'Availability';
    }

    if (window.location.hash.substring(1) !== pageId) {
      window.history.pushState({ pageId }, '', '#' + pageId);
    }

    updateActiveMenu(pageId, isInitialLoad);

    // --- LAZY LOADERS ROUTING ---
    try {
      if (pageId === 'MySchedule') { if(typeof loadMySchedulePage === 'function') loadMySchedulePage(); }
      else if (pageId === 'Availability') { if(typeof loadAvailabilityPage === 'function') loadAvailabilityPage(); }
      else if (pageId === 'UserGuide') { if(typeof loadUserGuidePage === 'function') loadUserGuidePage(); }
      else if (pageId === 'MST') { if(typeof loadMstPage === 'function') loadMstPage(); }
      else if (pageId === 'Nursing') { if(typeof loadNursingPage === 'function') loadNursingPage(); }
      else if (pageId === 'MLT') { if(typeof loadMLTPage === 'function') loadMLTPage(); }
      else if (pageId === 'ProctorSchedule') { if(typeof loadProctorSchedulePage === 'function') loadProctorSchedulePage(); }
      else if (pageId === 'Reporting') { if(typeof loadReportingPage === 'function') loadReportingPage(); }
      else if (pageId === 'ProofingTools') { if(typeof loadProofingToolsPage === 'function') loadProofingToolsPage(); }
      else if (pageId === 'TechHub') { if(typeof loadTechHubPage === 'function') loadTechHubPage(); }
      else if (pageId === 'Settings') { if(typeof loadSettingsPage === 'function') loadSettingsPage(); }
    } catch (err) {
      console.error("Error loading page " + pageId + ":", err);
    }
  }

  function updateActiveMenu(pageId, isInitialLoad) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
    const activeItem = document.querySelector(`[data-page-id="${pageId}"]`);
    if (activeItem) {
      activeItem.classList.add('active');
      const parentSubMenu = activeItem.closest('.sub-menu');
      if (parentSubMenu) {
        const parentId = parentSubMenu.id.replace('submenu-', '');
        const parentLink = document.getElementById(`nav-toggle-${parentId}`);
        if (parentLink) {
          parentLink.classList.add('active');
          if (isInitialLoad) toggleSubmenu(parentId);
        }
      }
    }
  }
  
  function openTab(evt, tabName) {
    let i, tabcontent, tablinks;
    const parentPage = evt.currentTarget.closest('.page-view');
    tabcontent = parentPage.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
    tablinks = parentPage.getElementsByClassName("tab-link");
    for (i = 0; i < tablinks.length; i++) tablinks[i].className = tablinks[i].className.replace(" active", "");
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";
  }

  function toggleSidebar() {
    document.getElementById('app-sidebar').classList.toggle('collapsed');
    document.getElementById('app-content').classList.toggle('collapsed');
  }

  function populateUserInfo() {
    const userInfo = g.userInfo || { email: 'Error', role: 'None' };
    const emailEl = document.getElementById('user-email');
    if (emailEl) {
      emailEl.textContent = userInfo.email + " (" + userInfo.role + ")";
    }
  }
</script>
