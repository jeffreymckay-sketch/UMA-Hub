<style>
  /* Role Selector Styling */
  .role-selector-container {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-width: 300px;
  }
  .role-pill {
    display: flex;
    align-items: center;
    background: #f0f0f0;
    border: 1px solid #ccc;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
  }
  .role-pill:hover { background: #e0e0e0; }
  .role-pill input { margin-right: 5px; cursor: pointer; }
  .role-pill.active {
    background: var(--color-primary-navy);
    color: white;
    border-color: var(--color-primary-navy);
  }
  
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* Permissions Matrix Styles */
  .matrix-table th { text-align: center; }
  .matrix-table td { text-align: center; }
  .matrix-table td:first-child { text-align: left; font-weight: bold; }
  .matrix-check { width: 18px; height: 18px; cursor: pointer; }
</style>

<script>
  /**
   * -------------------------------------------------------------------
   * SETTINGS & STAFF MANAGEMENT JS
   * -------------------------------------------------------------------
   */

  // Define the roles available in the system
  const SYSTEM_ROLES = ["Admin", "Lead", "Staff", "Tech Hub", "MST", "Proctor", "FDC"];

  function loadSettingsPage() {
    console.log("Loading Settings Page...");
    const view = document.getElementById('page-Settings');
    if (!view) return;

    // Check if user is Admin to show sensitive tabs
    const isAdmin = g.userInfo && g.userInfo.role.includes('Admin');

    view.innerHTML = `
      <div class="widget">
        <div class="tab-bar">
          <button class="tab-link active" onclick="openSettingsTab(event, 'settings-app')">App Configuration</button>
          <button class="tab-link" id="staff-mgmt-tab-btn" onclick="openSettingsTab(event, 'settings-staff')">Staff Management</button>
          <button class="tab-link" id="perm-matrix-tab-btn" onclick="openSettingsTab(event, 'settings-permissions')">Permissions Matrix</button>
        </div>

        <div id="settings-app" class="tab-content" style="display:block; padding-top:20px;">
          <h3>App Configuration</h3>
          <p>Global app settings and ID mapping can be managed here.</p>
          <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;">
            <label class="role-pill" id="pill-beta-nursing" style="display: inline-flex; font-size: 14px; padding: 5px 10px;">
              <input type="checkbox" id="beta-nursing-toggle" onchange="toggleBetaNursing(this)">
              Enable Beta Nursing Page
            </label>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">(Visible to Admins only. Toggles access to the new Nursing backend.)</p>
          </div>
          <button class="button-secondary" onclick="runAdminMapTabs()">Refresh Sheet Mapping</button>
        </div>
          <h3>App Configuration</h3>
          <p>Global app settings and ID mapping can be managed here.</p>
          <button class="button-secondary" onclick="runAdminMapTabs()">Refresh Sheet Mapping</button>
        </div>

        <div id="settings-staff" class="tab-content" style="display:none; padding-top:20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
             <h3 style="margin:0;">Staff & Permissions</h3>
             <div style="display:flex; gap:10px;">
                <button class="button-success" id="btn-save-all-staff" onclick="saveAllStaff(this)">Save All Changes</button>
                <button class="button-primary" onclick="showAddStaffForm()">+ Add New Staff</button>
             </div>
          </div>
          <div id="staff-list-container">
            <div class="loader-ring"></div>
          </div>
        </div>

        <div id="settings-permissions" class="tab-content" style="display:none; padding-top:20px;">
           <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
             <div>
                <h3 style="margin:0;">Permissions Matrix</h3>
                <p style="margin:5px 0; color:#666; font-size:0.9em;">Control which roles can access specific tools and pages.</p>
             </div>
             <button class="button-success" onclick="savePermissionsMatrix(this)">Save Permissions</button>
           </div>
           <div id="permissions-matrix-container">
              <div class="loader-ring"></div>
           </div>
        </div>
      </div>
    `;

    const staffTabBtn = document.getElementById('staff-mgmt-tab-btn');
    const permTabBtn = document.getElementById('perm-matrix-tab-btn');
    
    if (!isAdmin) {
        if(staffTabBtn) staffTabBtn.style.display = 'none';
        if(permTabBtn) permTabBtn.style.display = 'none';
    }
  }

  function openSettingsTab(evt, tabName) {
    if (evt) evt.preventDefault();
    const view = document.getElementById('page-Settings');
    const contents = view.getElementsByClassName("tab-content");
    for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
    const links = view.getElementsByClassName("tab-link");
    for (let i = 0; i < links.length; i++) links[i].className = links[i].className.replace(" active", "");
    
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";

    if (tabName === 'settings-staff') {
      fetchFullStaffList();
    }
    if (tabName === 'settings-permissions') {
      fetchPermissionsMatrix();
    }
    if (tabName === 'settings-app') {
      initAppConfig();
    }
      fetchPermissionsMatrix();
    }
  }

n  function initAppConfig() {
    const toggle = document.getElementById('beta-nursing-toggle');
    if (toggle && g.settings) {
      toggle.checked = g.settings.enableBetaNursing === true || g.settings.enableBetaNursing === 'true';
      togglePillClass(toggle, 'pill-beta-nursing');
    }
  }

  function toggleBetaNursing(checkbox) {
    togglePillClass(checkbox, 'pill-beta-nursing');
    const isEnabled = checkbox.checked;
    google.script.run.withSuccessHandler(res => { if(res.success) { g.settings = res.data; showNotification("Settings Saved", "success"); } else { showNotification(res.message, "error"); checkbox.checked = !isEnabled; togglePillClass(checkbox, 'pill-beta-nursing'); } }).api_saveSettings('enableBetaNursing', isEnabled);
  }

  // --- STAFF MANAGEMENT LOGIC ---

  function fetchFullStaffList() {
    const container = document.getElementById('staff-list-container');
    if (!container) return;
    container.innerHTML = '<div class="loader-ring"></div>';

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          renderStaffTable(res.data);
        } else {
          container.innerHTML = `<div class="error-message">${res.message}</div>`;
        }
      })
      .api_getFullStaffList();
  }

  function renderStaffTable(staff) {
    const container = document.getElementById('staff-list-container');
    
    let rows = staff.map(s => {
      const safeId = s.email.replace(/[@.]/g,'');
      const currentRoles = s.roles.split(',').map(r => r.trim());

      // Build the Checkbox/Pill UI for roles
      const roleHtml = SYSTEM_ROLES.map(role => {
        const isChecked = currentRoles.includes(role);
        return `
          <label class="role-pill ${isChecked ? 'active' : ''}" id="pill-${safeId}-${role}">
            <input type="checkbox" value="${role}" ${isChecked ? 'checked' : ''} 
              onchange="togglePillClass(this, 'pill-${safeId}-${role}')" 
              class="role-check-${safeId}"> 
            ${role}
          </label>
        `;
      }).join('');

      return `
      <tr class="staff-row" data-email="${s.email}" data-name="${s.fullName}">
        <td><strong>${s.fullName}</strong></td>
        <td><small>${s.email}</small></td>
        <td>
          <div class="role-selector-container">
            ${roleHtml}
          </div>
        </td>
        <td style="text-align:center;">
          <input type="checkbox" ${s.isActive ? 'checked' : ''} class="active-check" id="active-${safeId}">
        </td>
        <td>
          <button class="button-secondary btn-sm" onclick="updateSingleStaff(this, '${s.email}', '${s.fullName}')">Save</button>
        </td>
      </tr>
    `}).join('');

    container.innerHTML = `
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Roles</th>
            <th style="text-align:center;">Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function togglePillClass(checkbox, pillId) {
    const pill = document.getElementById(pillId);
    if (checkbox.checked) pill.classList.add('active');
    else pill.classList.remove('active');
  }

  function updateSingleStaff(btn, email, fullName) {
    const safeId = email.replace(/[@.]/g,'');
    const roleChecks = document.querySelectorAll(`.role-check-${safeId}`);
    const roles = Array.from(roleChecks).filter(c => c.checked).map(c => c.value).join(', ');
    const isActive = document.getElementById(`active-${safeId}`).checked;

    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = "Saving...";

    google.script.run.withSuccessHandler(res => {
        if (res.success) {
          btn.textContent = "Saved! ✅";
          btn.style.backgroundColor = "#28a745"; btn.style.color = "white";
          setTimeout(() => { btn.disabled = false; btn.textContent = originalText; btn.style.backgroundColor = ""; btn.style.color = ""; }, 2000);
        } else {
          showNotification(res.message, 'error');
          btn.disabled = false; btn.textContent = originalText;
        }
      }).api_updateStaffMember({ fullName, email, roles, isActive });
  }

  function saveAllStaff(btn) {
    const rows = document.querySelectorAll('.staff-row');
    const updates = [];
    rows.forEach(row => {
      const email = row.dataset.email;
      const fullName = row.dataset.name;
      const safeId = email.replace(/[@.]/g,'');
      const roleChecks = row.querySelectorAll(`.role-check-${safeId}`);
      const roles = Array.from(roleChecks).filter(c => c.checked).map(c => c.value).join(', ');
      const isActive = row.querySelector('.active-check').checked;
      updates.push({ fullName, email, roles, isActive });
    });

    const originalText = btn.textContent;
    btn.disabled = true; btn.textContent = "Updating All...";

    google.script.run.withSuccessHandler(res => {
        btn.disabled = false; btn.textContent = originalText;
        if (res.success) { showNotification(res.message, 'success'); fetchFullStaffList(); } 
        else { showNotification(res.message, 'error'); }
      }).api_bulkUpdateStaff(updates);
  }

  function showAddStaffForm() {
    const name = prompt("Enter Full Name:");
    if (!name) return;
    const email = prompt("Enter Email (StaffID):");
    if (!email) return;
    google.script.run.withSuccessHandler(res => {
        showNotification(res.message, res.success ? 'success' : 'error');
        fetchFullStaffList();
      }).api_addStaffMember({ fullName: name, email: email, roles: "Staff" });
  }

  // --- PERMISSIONS MATRIX LOGIC ---

  function fetchPermissionsMatrix() {
      const container = document.getElementById('permissions-matrix-container');
      container.innerHTML = '<div class="loader-ring"></div>';
      
      google.script.run.withSuccessHandler(res => {
          if(res.success) {
              renderPermissionsMatrix(res.data, res.roles, res.pages);
          } else {
              container.innerHTML = `<div class="error-message">${res.message}</div>`;
          }
      }).api_getPermissionsMatrix();
  }

  function renderPermissionsMatrix(matrix, roles, pages) {
      const container = document.getElementById('permissions-matrix-container');
      
      let headerHtml = `<th>Page / Tool</th>`;
      roles.forEach(role => {
          headerHtml += `<th>${role}</th>`;
      });

      let bodyHtml = '';
      pages.forEach(page => {
          let rowHtml = `<td>${page}</td>`;
          roles.forEach(role => {
              const isChecked = matrix[page] && matrix[page][role] === true;
              // Lock Admin Settings to Checked
              const isLocked = (page === 'Settings' && role === 'Admin');
              const disabledAttr = isLocked ? 'disabled' : '';
              const checkedAttr = (isChecked || isLocked) ? 'checked' : '';
              
              rowHtml += `
                <td>
                    <input type="checkbox" class="matrix-check" 
                           data-page="${page}" data-role="${role}" 
                           ${checkedAttr} ${disabledAttr}>
                </td>`;
          });
          bodyHtml += `<tr>${rowHtml}</tr>`;
      });

      container.innerHTML = `
        <table class="data-table matrix-table">
            <thead><tr>${headerHtml}</tr></thead>
            <tbody>${bodyHtml}</tbody>
        </table>
      `;
  }

  function savePermissionsMatrix(btn) {
      const updates = {};
      const checkboxes = document.querySelectorAll('.matrix-check');
      
      checkboxes.forEach(cb => {
          const page = cb.dataset.page;
          const role = cb.dataset.role;
          if (!updates[page]) updates[page] = {};
          updates[page][role] = cb.checked;
      });

      const originalText = btn.textContent;
      btn.disabled = true; btn.textContent = "Saving...";

      google.script.run.withSuccessHandler(res => {
          btn.disabled = false; btn.textContent = originalText;
          if(res.success) {
              showNotification("Permissions Updated. Reloading...", "success");
              // Refresh app after 1s to apply changes
              setTimeout(() => {
                  google.script.run.withSuccessHandler(initRes => {
                      if(initRes.success) {
                          g.permissions = initRes.data.permissions; // Update local cache
                          buildMenu(); // Rebuild menu with new permissions
                          navigateToPage('Settings'); // Stay on settings
                      }
                  }).api_getInitialAppData();
              }, 1000);
          } else {
              showNotification(res.message, "error");
          }
      }).api_savePermissionsMatrix(updates);
  }

  function runAdminMapTabs() {
    if (!confirm("This will refresh the internal list of sheet names. Proceed?")) return;
    google.script.run.withSuccessHandler(res => showNotification("Mapping Updated", "success")).admin_mapSheetTabs();
  }
</script>
