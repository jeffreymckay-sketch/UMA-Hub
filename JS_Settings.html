<style>
  /* Role Selector Styling */
  .role-selector-container {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-width: 300px;
  }
  .role-pill {
    display: flex;
    align-items: center;
    background: #f0f0f0;
    border: 1px solid #ccc;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s;
  }
  .role-pill:hover { background: #e0e0e0; }
  .role-pill input { margin-right: 5px; cursor: pointer; }
  .role-pill.active {
    background: var(--color-primary-navy);
    color: white;
    border-color: var(--color-primary-navy);
  }
  
  .btn-sm { padding: 5px 10px; font-size: 12px; }
</style>

<script>
  /**
   * -------------------------------------------------------------------
   * SETTINGS & STAFF MANAGEMENT JS
   * -------------------------------------------------------------------
   */

  // Define the roles available in the system
  const SYSTEM_ROLES = ["Admin", "Lead", "Staff", "Tech Hub", "MST", "Proctor", "FDC"];

  function loadSettingsPage() {
    console.log("Loading Settings Page...");
    const view = document.getElementById('page-Settings');
    if (!view) return;

    view.innerHTML = `
      <div class="widget">
        <div class="tab-bar">
          <button class="tab-link active" onclick="openSettingsTab(event, 'settings-app')">App Configuration</button>
          <button class="tab-link" id="staff-mgmt-tab-btn" onclick="openSettingsTab(event, 'settings-staff')">Staff Management</button>
        </div>

        <div id="settings-app" class="tab-content" style="display:block; padding-top:20px;">
          <h3>App Configuration</h3>
          <p>Global app settings and ID mapping can be managed here.</p>
          <button class="button-secondary" onclick="runAdminMapTabs()">Refresh Sheet Mapping</button>
        </div>

        <div id="settings-staff" class="tab-content" style="display:none; padding-top:20px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
             <h3 style="margin:0;">Staff & Permissions</h3>
             <div style="display:flex; gap:10px;">
                <button class="button-success" id="btn-save-all-staff" onclick="saveAllStaff(this)">Save All Changes</button>
                <button class="button-primary" onclick="showAddStaffForm()">+ Add New Staff</button>
             </div>
          </div>
          <div id="staff-list-container">
            <div class="loader-ring"></div>
          </div>
        </div>
      </div>
    `;

    const userRole = (g.userInfo && g.userInfo.role) ? g.userInfo.role : "";
    const staffTabBtn = document.getElementById('staff-mgmt-tab-btn');
    if (staffTabBtn) {
      if (userRole.includes('Admin')) {
        staffTabBtn.style.display = 'inline-block';
      } else {
        staffTabBtn.style.display = 'none';
      }
    }
  }

  function openSettingsTab(evt, tabName) {
    if (evt) evt.preventDefault();
    const view = document.getElementById('page-Settings');
    const contents = view.getElementsByClassName("tab-content");
    for (let i = 0; i < contents.length; i++) contents[i].style.display = "none";
    const links = view.getElementsByClassName("tab-link");
    for (let i = 0; i < links.length; i++) links[i].className = links[i].className.replace(" active", "");
    
    document.getElementById(tabName).style.display = "block";
    evt.currentTarget.className += " active";

    if (tabName === 'settings-staff') {
      fetchFullStaffList();
    }
  }

  function fetchFullStaffList() {
    const container = document.getElementById('staff-list-container');
    if (!container) return;
    container.innerHTML = '<div class="loader-ring"></div>';

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          renderStaffTable(res.data);
        } else {
          container.innerHTML = `<div class="error-message">${res.message}</div>`;
        }
      })
      .api_getFullStaffList();
  }

  function renderStaffTable(staff) {
    const container = document.getElementById('staff-list-container');
    
    let rows = staff.map(s => {
      const safeId = s.email.replace(/[@.]/g,'');
      const currentRoles = s.roles.split(',').map(r => r.trim());

      // Build the Checkbox/Pill UI for roles
      const roleHtml = SYSTEM_ROLES.map(role => {
        const isChecked = currentRoles.includes(role);
        return `
          <label class="role-pill ${isChecked ? 'active' : ''}" id="pill-${safeId}-${role}">
            <input type="checkbox" value="${role}" ${isChecked ? 'checked' : ''} 
              onchange="togglePillClass(this, 'pill-${safeId}-${role}')" 
              class="role-check-${safeId}"> 
            ${role}
          </label>
        `;
      }).join('');

      return `
      <tr class="staff-row" data-email="${s.email}" data-name="${s.fullName}">
        <td><strong>${s.fullName}</strong></td>
        <td><small>${s.email}</small></td>
        <td>
          <div class="role-selector-container">
            ${roleHtml}
          </div>
        </td>
        <td style="text-align:center;">
          <input type="checkbox" ${s.isActive ? 'checked' : ''} class="active-check" id="active-${safeId}">
        </td>
        <td>
          <button class="button-secondary btn-sm" onclick="updateSingleStaff(this, '${s.email}', '${s.fullName}')">Save</button>
        </td>
      </tr>
    `}).join('');

    container.innerHTML = `
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Roles</th>
            <th style="text-align:center;">Active</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  // Visual helper to change pill color when clicked
  function togglePillClass(checkbox, pillId) {
    const pill = document.getElementById(pillId);
    if (checkbox.checked) pill.classList.add('active');
    else pill.classList.remove('active');
  }

  /**
   * Saves a single staff member with visual feedback
   */
  function updateSingleStaff(btn, email, fullName) {
    const safeId = email.replace(/[@.]/g,'');
    
    // Scrape roles from checkboxes
    const roleChecks = document.querySelectorAll(`.role-check-${safeId}`);
    const roles = Array.from(roleChecks).filter(c => c.checked).map(c => c.value).join(', ');
    const isActive = document.getElementById(`active-${safeId}`).checked;

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Saving...";

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          btn.textContent = "Saved! ✅";
          btn.style.backgroundColor = "#28a745";
          btn.style.color = "white";
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = originalText;
            btn.style.backgroundColor = "";
            btn.style.color = "";
          }, 2000);
        } else {
          showNotification(res.message, 'error');
          btn.disabled = false;
          btn.textContent = originalText;
        }
      })
      .api_updateStaffMember({ fullName, email, roles, isActive });
  }

  /**
   * Saves all staff members in the table at once
   */
  function saveAllStaff(btn) {
    const rows = document.querySelectorAll('.staff-row');
    const updates = [];

    rows.forEach(row => {
      const email = row.dataset.email;
      const fullName = row.dataset.name;
      const safeId = email.replace(/[@.]/g,'');
      
      const roleChecks = row.querySelectorAll(`.role-check-${safeId}`);
      const roles = Array.from(roleChecks).filter(c => c.checked).map(c => c.value).join(', ');
      const isActive = row.querySelector('.active-check').checked;

      updates.push({ fullName, email, roles, isActive });
    });

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Updating All...";

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.textContent = originalText;
        if (res.success) {
          showNotification(res.message, 'success');
          fetchFullStaffList(); // Refresh table
        } else {
          showNotification(res.message, 'error');
        }
      })
      .api_bulkUpdateStaff(updates);
  }

  function showAddStaffForm() {
    const name = prompt("Enter Full Name:");
    if (!name) return;
    const email = prompt("Enter Email (StaffID):");
    if (!email) return;
    
    // For adding, we'll keep it simple and default to "Staff"
    google.script.run
      .withSuccessHandler(res => {
        showNotification(res.message, res.success ? 'success' : 'error');
        fetchFullStaffList();
      })
      .api_addStaffMember({ fullName: name, email: email, roles: "Staff" });
  }

  function runAdminMapTabs() {
    if (!confirm("This will refresh the internal list of sheet names. Proceed?")) return;
    google.script.run
      .withSuccessHandler(res => showNotification("Mapping Updated", "success"))
      .admin_mapSheetTabs();
  }
</script>
